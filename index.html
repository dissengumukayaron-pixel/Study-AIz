<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>StudyAIz - Seu Tutor Inteligente</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f7fb;
    color: #1f2937;
}

button {
    cursor: pointer;
}

.menu-btn {
    position: fixed;
    top: 15px;
    left: 15px;
    z-index: 1000;
    border: none;
    background: #2563eb;
    color: white;
    padding: 12px 15px;
    border-radius: 10px;
    font-size: 20px;
}

.sidebar {
    position: fixed;
    left: -270px;
    top: 0;
    width: 270px;
    height: 100%;
    background: #111827;
    color: white;
    padding: 25px 15px;
    transition: 0.3s;
    z-index: 999;
    overflow-y: auto;
}

.sidebar.open {
    left: 0;
}

.sidebar h2 {
    text-align: center;
    margin-bottom: 25px;
}

.sidebar button {
    width: 100%;
    padding: 13px;
    margin: 5px 0;
    border: none;
    border-radius: 8px;
    background: #1f2937;
    color: white;
    text-align: left;
}

.sidebar button:hover {
    background: #2563eb;
}

.overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.4);
    z-index: 998;
}

.overlay.show {
    display: block;
}

main {
    max-width: 1000px;
    margin: auto;
    padding: 70px 20px 40px;
}

.screen {
    display: none;
}

.screen.active {
    display: block;
}

.card {
    background: white;
    padding: 25px;
    margin: 15px 0;
    border-radius: 18px;
    box-shadow: 0 5px 20px rgba(0,0,0,.07);
}

h1 {
    color: #2563eb;
}

h2 {
    color: #1d4ed8;
}

input,
select {
    width: 100%;
    padding: 13px;
    margin: 8px 0;
    border: 1px solid #d1d5db;
    border-radius: 9px;
    font-size: 16px;
}

.primary {
    background: #2563eb;
    color: white;
    border: none;
    padding: 13px 20px;
    border-radius: 9px;
    font-size: 16px;
}

.primary:hover {
    background: #1d4ed8;
}

.secondary {
    background: #e5e7eb;
    color: #111827;
    border: none;
    padding: 13px 20px;
    border-radius: 9px;
}

.options {
    display: grid;
    gap: 10px;
}

.option {
    padding: 14px;
    border: 1px solid #d1d5db;
    border-radius: 10px;
    background: white;
    width: 100%;
}

.option:hover {
    background: #eff6ff;
}

#chatBox {
    height: 430px;
    overflow-y: auto;
    padding: 15px;
    background: #f3f4f6;
    border-radius: 15px;
    margin-bottom: 15px;
}

.message {
    max-width: 85%;
    padding: 12px 15px;
    margin: 10px 0;
    border-radius: 14px;
    white-space: pre-wrap;
    line-height: 1.5;
}

.message.user {
    margin-left: auto;
    background: #2563eb;
    color: white;
}

.message.ai {
    margin-right: auto;
    background: white;
    border: 1px solid #e5e7eb;
}

.ai-input {
    display: flex;
    gap: 10px;
}

.ai-input input {
    margin: 0;
}

.ai-input button {
    white-space: nowrap;
}

.stat {
    padding: 20px;
    background: #eff6ff;
    border-radius: 15px;
    margin: 10px 0;
}

.center {
    text-align: center;
}

.setup-step {
    display: none;
}

.setup-step.active {
    display: block;
}

.subject-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit,minmax(180px,1fr));
    gap: 15px;
}

.subject {
    background: white;
    padding: 20px;
    border-radius: 15px;
    box-shadow: 0 3px 15px rgba(0,0,0,.06);
    text-align: center;
}

@media(max-width:600px) {
    main {
        padding: 70px 12px 30px;
    }

    .card {
        padding: 18px;
    }

    .ai-input {
        flex-direction: column;
    }

    .message {
        max-width: 95%;
    }
}
</style>
</head>

<body>

<button class="menu-btn" onclick="toggleMenu()">☰</button>

<div class="overlay" id="overlay" onclick="toggleMenu()"></div>

<aside class="sidebar" id="sidebar">
    <h2>📚 StudyAIz</h2>

    <button onclick="showScreen('home')">🏠 Início</button>
    <button onclick="showScreen('ai')">🤖 Tutor IA</button>
    <button onclick="showScreen('theory')">📖 Teoria</button>
    <button onclick="showScreen('tests')">📝 Testes</button>
    <button onclick="showScreen('progress')">📊 Progresso</button>
    <button onclick="showScreen('subjects')">📚 Disciplinas</button>
    <button onclick="showScreen('settings')">⚙️ Definições</button>
</aside>

<main>

<section id="setup" class="screen active">

    <div class="card center">
        <h1>🌍 Bem-vindo ao StudyAIz</h1>
        <p>O teu tutor inteligente para aprender melhor.</p>
    </div>

    <div id="step1" class="setup-step active card">
        <h2>1️⃣ Escolhe o teu país</h2>

        <select id="country">
            <option value="">Seleciona o país</option>
            <option value="Angola">🇦🇴 Angola</option>
            <option value="Portugal">🇵🇹 Portugal</option>
            <option value="Brasil">🇧🇷 Brasil</option>
            <option value="Moçambique">🇲🇿 Moçambique</option>
            <option value="Cabo Verde">🇨🇻 Cabo Verde</option>
            <option value="Guiné-Bissau">🇬🇼 Guiné-Bissau</option>
            <option value="São Tomé e Príncipe">🇸🇹 São Tomé e Príncipe</option>
            <option value="Timor-Leste">🇹🇱 Timor-Leste</option>
            <option value="EUA">🇺🇸 Estados Unidos</option>
            <option value="França">🇫🇷 França</option>
            <option value="Espanha">🇪🇸 Espanha</option>
            <option value="Reino Unido">🇬🇧 Reino Unido</option>
            <option value="Outro">🌍 Outro</option>
        </select>

        <button class="primary" onclick="nextStep(2)">
            Continuar
        </button>
    </div>

    <div id="step2" class="setup-step card">
        <h2>2️⃣ Escolhe o teu nível</h2>

        <select id="level">
            <option value="">Seleciona o nível</option>
            <option>Ensino Básico</option>
            <option>Ensino Fundamental</option>
            <option>Ensino Médio</option>
            <option>Ensino Secundário</option>
            <option>Universidade</option>
        </select>

        <button class="primary" onclick="nextStep(3)">
            Continuar
        </button>
    </div>

    <div id="step3" class="setup-step card">
        <h2>3️⃣ Qual é o teu ano?</h2>

        <select id="year">
            <option value="">Seleciona o ano</option>
            <option>1º ano</option>
            <option>2º ano</option>
            <option>3º ano</option>
            <option>4º ano</option>
            <option>5º ano</option>
            <option>6º ano</option>
            <option>7º ano</option>
            <option>8º ano</option>
            <option>9º ano</option>
            <option>10º ano</option>
            <option>11º ano</option>
            <option>12º ano</option>
            <option>Universitário</option>
        </select>

        <button class="primary" onclick="nextStep(4)">
            Continuar
        </button>
    </div>

    <div id="step4" class="setup-step card">
        <h2>4️⃣ Escolhe uma disciplina</h2>

        <select id="subject">
            <option value="">Seleciona a disciplina</option>
            <option>Matemática</option>
            <option>Português</option>
            <option>Inglês</option>
            <option>Física</option>
            <option>Química</option>
            <option>Biologia</option>
            <option>História</option>
            <option>Geografia</option>
            <option>Informática</option>
            <option>Economia</option>
            <option>Filosofia</option>
        </select>

        <button class="primary" onclick="finishSetup()">
            Começar a estudar 🚀
        </button>
    </div>

</section>
