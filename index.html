<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>StudyAIz - Assistente de Estudos</title>

<!-- Biblioteca 3D -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #eef2ff, #f8faff);
    color: #1f2937;
}

header {
    background: linear-gradient(135deg, #5b21b6, #2563eb);
    color: white;
    padding: 20px;
    text-align: center;
}

.logo {
    font-size: 30px;
    font-weight: bold;
}

.container {
    width: 92%;
    max-width: 1000px;
    margin: 30px auto;
}

.card {
    background: white;
    padding: 28px;
    border-radius: 22px;
    box-shadow: 0 10px 30px rgba(0,0,0,.08);
    margin-bottom: 25px;
}

.hidden {
    display: none !important;
}

h1, h2 {
    color: #4c1d95;
}

.hero {
    width: 100%;
    max-width: 500px;
    display: block;
    margin: 0 auto 20px;
    border-radius: 20px;
}

select {
    width: 100%;
    padding: 15px;
    border: 2px solid #ddd;
    border-radius: 12px;
    font-size: 16px;
    margin: 10px 0 20px;
    background: white;
}

button {
    border: none;
    padding: 13px 22px;
    border-radius: 12px;
    background: linear-gradient(135deg, #6d28d9, #2563eb);
    color: white;
    font-size: 16px;
    cursor: pointer;
    margin: 5px;
}

button:hover {
    opacity: .9;
    transform: translateY(-1px);
}

.back {
    background: #6b7280;
}

.subjects {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 15px;
    margin: 20px 0;
}

.subject {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 16px;
    border: 2px solid #e5e7eb;
    border-radius: 14px;
    cursor: pointer;
}

.subject:hover {
    border-color: #7c3aed;
    background: #f5f3ff;
}

.subject input {
    width: 18px;
    height: 18px;
}

.success {
    background: #ecfdf5;
    color: #065f46;
    padding: 15px;
    border-radius: 12px;
    margin-top: 15px;
}

/* LABORATÓRIO */

.lab-title {
    text-align: center;
    font-size: 32px;
}

.lab-description {
    text-align: center;
    color: #6b7280;
}

.lab-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
    gap: 18px;
    margin-top: 25px;
}

.lab-card {
    background: linear-gradient(145deg, #ffffff, #f1f5ff);
    padding: 25px;
    border-radius: 20px;
    text-align: center;
    border: 2px solid #e5e7eb;
    cursor: pointer;
    transition: .2s;
}

.lab-card:hover {
    transform: translateY(-5px);
    border-color: #7c3aed;
}

.lab-icon {
    font-size: 50px;
}

#canvas3d {
    width: 100%;
    height: 430px;
    border-radius: 20px;
    overflow: hidden;
    background: #050816;
    margin-top: 20px;
    position: relative;
}

.controls {
    text-align: center;
    margin: 15px 0;
}

.info-box {
    padding: 18px;
    background: #f5f3ff;
    border-radius: 15px;
    margin-top: 15px;
}

footer {
    text-align: center;
    padding: 30px;
    color: #6b7280;
}
</style>
</head>

<body>

<header>
    <div class="logo">📚 StudyAIz</div>
    <div>O teu assistente inteligente de estudos</div>
</header>

<div class="container">

<!-- ================= PASSO 1 ================= -->

<section id="step1" class="card">

    <img src="studyaiz-visual.png"
         class="hero"
         alt="StudyAIz">

    <h1>🌍 Bem-vindo ao StudyAIz</h1>

    <p>
        Primeiro, escolha o teu país para adaptarmos
        a experiência de aprendizagem.
    </p>

    <label><strong>País</strong></label>

    <select id="country">
        <option value="">-- Escolha o país --</option>
        <option value="Angola">🇦🇴 Angola</option>
        <option value="Portugal">🇵🇹 Portugal</option>
        <option value="Brasil">🇧🇷 Brasil</option>
        <option value="Moçambique">🇲🇿 Moçambique</option>
        <option value="Cabo Verde">🇨🇻 Cabo Verde</option>
        <option value="Guiné-Bissau">🇬🇼 Guiné-Bissau</option>
        <option value="São Tomé e Príncipe">🇸🇹 São Tomé e Príncipe</option>
        <option value="Estados Unidos">🇺🇸 Estados Unidos</option>
        <option value="Reino Unido">🇬🇧 Reino Unido</option>
        <option value="França">🇫🇷 França</option>
        <option value="Espanha">🇪🇸 Espanha</option>
        <option value="Outro">🌎 Outro</option>
    </select>

    <button onclick="nextStep(1)">
        Continuar →
    </button>

</section>


<!-- ================= PASSO 2 ================= -->

<section id="step2" class="card hidden">

    <h2>🎓 Nível de ensino</h2>

    <p>
        Escolha o teu nível de ensino.
    </p>

    <select id="level" onchange="updateGrades()">

        <option value="">
            -- Escolha o nível --
        </option>

        <option value="basico">
            Ensino Básico
        </option>

        <option value="secundario">
            Ensino Secundário
        </option>

        <option value="medio">
            Ensino Médio
        </option>

        <option value="universidade">
            Universidade
        </option>

    </select>

    <label><strong>Classe / Ano</strong></label>

    <select id="grade">
        <option value="">
            -- Primeiro escolha o nível --
        </option>
    </select>

    <br>

    <button class="back" onclick="previousStep(2)">
        ← Voltar
    </button>

    <button onclick="nextStep(2)">
        Continuar →
    </button>

</section>
