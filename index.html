<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>StudyAI - Aprende sem limites</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #172033;
        }

        /* =========================
           HEADER
        ========================= */

        header {
            background:
                radial-gradient(circle at 85% 20%, rgba(99,102,241,.45), transparent 30%),
                linear-gradient(135deg, #061735, #123b83 55%, #2563eb);
            color: white;
            padding: 28px 25px 80px;
        }

        .topbar {
            max-width: 1100px;
            margin: auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 26px;
            font-weight: bold;
        }

        .badge {
            background: rgba(255,255,255,.12);
            border: 1px solid rgba(255,255,255,.2);
            padding: 9px 14px;
            border-radius: 20px;
            font-size: 13px;
        }

        .hero {
            max-width: 900px;
            margin: 65px auto 0;
            text-align: center;
        }

        .hero h1 {
            font-size: 48px;
            line-height: 1.1;
            margin: 0 0 18px;
        }

        .hero p {
            font-size: 18px;
            opacity: .9;
            line-height: 1.6;
            margin: 0 auto;
            max-width: 650px;
        }

        /* =========================
           MAIN
        ========================= */

        main {
            max-width: 1100px;
            margin: -45px auto 60px;
            padding: 0 20px;
            position: relative;
        }

        .card {
            background: white;
            border-radius: 24px;
            padding: 30px;
            margin-bottom: 24px;
            box-shadow: 0 12px 40px rgba(15,23,42,.08);
            border: 1px solid #edf0f5;
        }

        .study-card {
            padding: 34px;
        }

        .section-title {
            margin-bottom: 25px;
        }

        .section-title h2 {
            margin: 0 0 8px;
            color: #102a56;
            font-size: 27px;
        }

        .section-title p {
            margin: 0;
            color: #667085;
        }

        /* =========================
           FORMULÁRIO
        ========================= */

        label {
            display: block;
            font-weight: bold;
            margin: 20px 0 8px;
            color: #344054;
        }

        select,
        input {
            width: 100%;
            padding: 16px;
            border: 1px solid #d0d5dd;
            border-radius: 14px;
            font-size: 16px;
            background: white;
            color: #172033;
            outline: none;
            transition: .2s;
        }

        select:focus,
        input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 4px rgba(37,99,235,.1);
        }

        .input-help {
            color: #667085;
            font-size: 13px;
            margin-top: 7px;
        }

        /* =========================
           UNIVERSIDADE
        ========================= */

        .universidade {
            display: none;
            background: #f8faff;
            border: 1px solid #e3e9f5;
            padding: 20px;
            border-radius: 17px;
            margin-top: 10px;
        }

        /* =========================
           BOTÕES
        ========================= */

        button {
            width: 100%;
            padding: 17px;
            margin-top: 22px;
            border: none;
            border-radius: 14px;
            background: linear-gradient(135deg, #2563eb, #4f46e5);
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            transition: .2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(37,99,235,.25);
        }

        /* =========================
           RECURSOS
        ========================= */

        .features {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 18px;
        }

        .feature {
            padding: 24px;
            background: #f8faff;
            border: 1px solid #edf2f7;
            border-radius: 18px;
        }

        .feature-icon {
            font-size: 32px;
            margin-bottom: 12px;
        }

        .feature h3 {
            margin: 0 0 8px;
        }

        .feature p {
            color: #667085;
            line-height: 1.5;
            margin-bottom: 0;
        }

        /* =========================
           EXPLICAÇÃO
        ========================= */

        .resposta {
            background: #eff6ff;
            border-left: 5px solid #2563eb;
            padding: 23px;
            border-radius: 16px;
            margin-top: 24px;
            line-height: 1.8;
        }

        .resposta h3 {
            color: #123b83;
        }

        /* =========================
           TESTE
        ========================= */

        .pergunta {
            background: #f8fafc;
            padding: 23px;
            margin-top: 18px;
            border-radius: 17px;
            border: 1px solid #e4e7ec;
        }

        .pergunta h3 {
            margin-top: 0;
        }

        .opcao {
            background: white;
            color: #172033;
            border: 1px solid #d0d5dd;
        }

        .opcao:hover {
            background: #eef4ff;
        }

        .correta {
            background: #dcfce7 !important;
            border: 2px solid #16a34a !important;
        }

        .errada {
            background: #fee2e2 !important;
            border: 2px solid #dc2626 !important;
        }

        /* =========================
           RESULTADO
        ========================= */

        .resultado {
            text-align: center;
            padding: 30px;
            background: linear-gradient(135deg, #eff6ff, #f5f3ff);
            border-radius: 20px;
            margin-top: 25px;
        }

        .nota {
            font-size: 55px;
            font-weight: bold;
            color: #2563eb;
        }

        /* =========================
           FOOTER
        ========================= */

        footer {
            text-align: center;
            color: #667085;
            padding: 25px;
            font-size: 14px;
        }

        .hidden {
            display: none;
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 700px) {

            header {
                padding: 22px 18px 70px;
            }

            .hero {
                margin-top: 50px;
            }

            .hero h1 {
                font-size: 36px;
            }

            .hero p {
                font-size: 16px;
            }

            main {
                padding: 0 14px;
            }

            .card,
            .study-card {
                padding: 22px;
                border-radius: 19px;
            }

            .features {
                grid-template-columns: 1fr;
            }

            .topbar {
                align-items: flex-start;
            }

            .badge {
                font-size: 11px;
            }
        }
    </style>
</head>
