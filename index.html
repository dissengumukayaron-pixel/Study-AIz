<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>StudyAIz - Assistente de Estudos</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #eef2ff, #f8fafc);
            color: #172033;
        }

        .container {
            width: 92%;
            max-width: 850px;
            margin: 40px auto;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo {
            font-size: 42px;
            font-weight: bold;
            color: #4f46e5;
        }

        .subtitle {
            color: #64748b;
            font-size: 17px;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 22px;
            box-shadow: 0 10px 35px rgba(0,0,0,0.08);
            margin-bottom: 20px;
        }

        h2 {
            margin-top: 0;
            color: #1e293b;
        }

        label {
            display: block;
            font-weight: bold;
            margin-top: 18px;
            margin-bottom: 8px;
        }

        select,
        input,
        textarea,
        button {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            border: 1px solid #cbd5e1;
            font-size: 16px;
        }

        select,
        input,
        textarea {
            background: white;
        }

        button {
            margin-top: 22px;
            border: none;
            background: #4f46e5;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #4338ca;
        }

        .hidden {
            display: none;
        }

        .welcome {
            background: #eef2ff;
            padding: 15px;
            border-radius: 12px;
            margin-top: 20px;
        }

        .materias {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 10px;
            margin-top: 15px;
        }

        .materia {
            padding: 15px;
            background: #f1f5f9;
            border-radius: 12px;
            cursor: pointer;
            text-align: center;
            font-weight: bold;
        }

        .materia:hover {
            background: #e0e7ff;
        }

        #resposta {
            margin-top: 20px;
            padding: 20px;
            background: #f8fafc;
            border-radius: 12px;
            min-height: 60px;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="header">
        <div class="logo">📚 StudyAIz</div>
        <div class="subtitle">
            O teu assistente inteligente de estudos
        </div>
    </div>

    <!-- CONFIGURAÇÃO -->
    <div class="card">

        <h2>🌍 Vamos personalizar os teus estudos</h2>

        <label for="pais">País</label>

        <select id="pais">
            <option value="">-- Escolhe o teu país --</option>
            <option value="Angola">🇦🇴 Angola</option>
            <option value="Portugal">🇵🇹 Portugal</option>
            <option value="Brasil">🇧🇷
